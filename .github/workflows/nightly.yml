name: Nightly

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write # gh-pages benchmark chart push

jobs:
  bench:
    name: bench-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            cc: gcc
          - name: macos-arm64
            os: macos-14
            cc: clang
            cmake_args: -DCMAKE_OSX_ARCHITECTURES=arm64
          - name: windows-x64
            os: windows-latest
            cc: cl
            cmake_args: -A x64
          - name: windows-arm64
            os: windows-11-arm
            cc: cl
            cmake_args: -A ARM64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            cc: gcc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow (deterministic bench images)
        run: python -m pip install --quiet pillow

      - name: Generate benchmark images
        run: |
          python tests/gen_bench.py
          python tests/gen_bench16.py

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPTPNG_BUILD_CPP_TESTS=ON ${{ matrix.cmake_args }}
        env:
          CC: ${{ matrix.cc }}

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Correctness first (a fast benchmark is worthless if wrong)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Compare benchmark pixels with libpng
        run: ./build/verify_suite tests/bench

      - name: Record benchmark machine
        run: python tools/bench_metadata.py machine_${{ matrix.name }}.json build

      - name: Benchmark vs libpng (zlib) and libpng (zlib-ng)
        run: |
          ./build/bench_compare ${{ matrix.name }} bench_${{ matrix.name }}.json \
            tests/bench/photo_rgb8.png \
            tests/bench/photo_rgba8.png \
            tests/bench/photo_gray8.png \
            tests/bench/photo_gray16.png \
            tests/bench/graphic_pal8.png \
            tests/bench/graphic_rgb8.png \
            tests/bench/photo_rgba16_paeth.png \
            tests/bench/graphic_rgba16_paeth.png \
            tests/bench/noise_rgba8.png
          ./build/bench_zlibng ${{ matrix.name }} bench_${{ matrix.name }}_zng.json \
            tests/bench/photo_rgb8.png \
            tests/bench/photo_rgba8.png \
            tests/bench/photo_gray8.png \
            tests/bench/photo_gray16.png \
            tests/bench/graphic_pal8.png \
            tests/bench/graphic_rgb8.png \
            tests/bench/photo_rgba16_paeth.png \
            tests/bench/graphic_rgba16_paeth.png \
            tests/bench/noise_rgba8.png
        shell: bash

      - name: Encoder speed and output size
        run: |
          ./build/bench_encode ${{ matrix.name }} encode_${{ matrix.name }}.json \
            tests/bench/photo_rgb8.png tests/bench/photo_rgba8.png \
            tests/bench/photo_gray8.png tests/bench/photo_gray16.png \
            tests/bench/graphic_pal8.png tests/bench/graphic_rgb8.png \
            tests/bench/photo_rgba16_paeth.png tests/bench/graphic_rgba16_paeth.png \
            tests/bench/noise_rgba8.png
          ./build/bench_encode_zlibng ${{ matrix.name }} encode_${{ matrix.name }}_zng.json \
            tests/bench/photo_rgb8.png tests/bench/photo_rgba8.png \
            tests/bench/photo_gray8.png tests/bench/photo_gray16.png \
            tests/bench/graphic_pal8.png tests/bench/graphic_rgb8.png \
            tests/bench/photo_rgba16_paeth.png tests/bench/graphic_rgba16_paeth.png \
            tests/bench/noise_rgba8.png
        shell: bash

      - name: Filter throughput (scalar and dispatched)
        run: |
          ./build/filters_test --bench | tee filters_${{ matrix.name }}.txt
          ./build/filters_test --bench-paeth | tee -a filters_${{ matrix.name }}.txt
        shell: bash

      - name: CPU feature report
        run: ./build/ptpng_tool tests/bench/photo_rgb8.png --info
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.name }}
          path: |
            bench_${{ matrix.name }}.json
            bench_${{ matrix.name }}_zng.json
            filters_${{ matrix.name }}.txt
            encode_${{ matrix.name }}.json
            encode_${{ matrix.name }}_zng.json
            machine_${{ matrix.name }}.json

  charts:
    name: update performance charts
    needs: bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          path: benches
          merge-multiple: true

      - name: Merge per-platform results
        run: python3 tools/merge_bench.py

      - name: Verify zlib-ng results have distinct series names
        run: python3 -c "import json; d=json.load(open('bench.json')); names=set(e['name'] for e in d); assert any('libpng-zng' in n for n in names), names; print(len(names), 'series')"

      - name: Initialize benchmark history branch if missing
        run: |
          history_ref=$(git ls-remote --heads origin gh-pages)
          if [ -z "$history_ref" ]; then
            empty_tree=$(git hash-object -w -t tree /dev/null)
            initial_commit=$(git -c user.name=github-actions[bot] \
              -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit-tree "$empty_tree" -m "Initialize benchmark history")
            git push origin "$initial_commit:refs/heads/gh-pages"
          fi

      - uses: benchmark-action/github-action-benchmark@v1
        with:
          name: ptpng vs libpng (nightly)
          tool: customBiggerIsBetter
          ref: ${{ github.sha }}
          output-file-path: bench.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: bench/
          alert-threshold: "120%"
          comment-on-alert: false
          fail-on-alert: false

      - uses: benchmark-action/github-action-benchmark@v1
        with:
          name: PNG encoding time and size (nightly)
          tool: customSmallerIsBetter
          ref: ${{ github.sha }}
          output-file-path: encode.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: bench/
          comment-on-alert: false
          fail-on-alert: false

      - name: Check dashboard calculations
        run: node --test tools/bench/dashboard_test.cjs

      - name: Check lossless history compaction
        run: python3 -m unittest discover -s tools/bench -p '*_test.py'

      - name: Check out updated benchmark history
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: dashboard-history

      - name: Publish dashboard from the tested source
        run: |
          python3 tools/bench/prepare_history.py dashboard-history/bench/data.js
          cp tools/bench/index.html tools/bench/dashboard.css tools/bench/dashboard.js dashboard-history/bench/
          git -C dashboard-history add bench/data.js bench/index.html bench/dashboard.css bench/dashboard.js
          if ! git -C dashboard-history diff --cached --quiet; then
            git -C dashboard-history -c user.name=github-actions[bot] \
              -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit -m "Publish benchmark dashboard"
            git -C dashboard-history push origin HEAD:gh-pages
          fi
